name: Nightly database backup

# Takes an ENCRYPTED backup of the production database every night (02:30 IST) and keeps it for 30 days as a
# workflow artifact. The file is useless without BACKUP_PASSPHRASE; keep that passphrase somewhere safe OUTSIDE GitHub too.
# Repository secrets needed (Settings -> Secrets and variables -> Actions):
#   BACKUP_MONGODB_URI  connection string of a READ-ONLY database user for the production database
#   BACKUP_PASSPHRASE   20+ random characters
on:
  schedule:
    - cron: '0 21 * * *' # 21:00 UTC = 02:30 IST
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci --omit=dev
      - name: Create and verify encrypted backup
        working-directory: server
        env:
          MONGODB_URI: ${{ secrets.BACKUP_MONGODB_URI }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: node scripts/backup.js --out=../backups
      - name: Upload backup (encrypted)
        uses: actions/upload-artifact@v4
        with:
          name: uem-backup-${{ github.run_number }}
          path: backups/*.bak
          retention-days: 30
          if-no-files-found: error
