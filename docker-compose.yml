# One-command local/VPS stack:  docker compose up --build
# Then seed demo data:           docker compose run --rm server node src/seed.js --force
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/admission_portal
      CLIENT_ORIGIN: http://localhost:8080
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env (32+ chars)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env (32+ chars)}
      COOKIE_SECURE: "false"      # plain HTTP on localhost; remove when serving over HTTPS
      COOKIE_SAMESITE: lax        # nginx proxies /api, so the browser sees a single origin
      SEED_PASSWORD: ${SEED_PASSWORD:?set SEED_PASSWORD in .env}
      UPLOAD_DIR: /app/uploads
    volumes: [uploads:/app/uploads]

  client:
    build: ./client
    restart: unless-stopped
    depends_on: [server]
    ports: ["8080:80"]

volumes:
  mongo-data:
  uploads:
